name: Create new release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: composite-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' | sed 's|^refs/tags/||' | grep -E "$semver" | sort -V | tail -n 1 || true)
          if [[ "$latest" =~ $semver ]]; then
            echo "Current version: $latest"
            tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "No release tag yet: starting at v0.0.1."
            tag="v0.0.1"
          fi
          echo "New version: $tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Release $tag" --generate-notes
          echo "Released $tag from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
